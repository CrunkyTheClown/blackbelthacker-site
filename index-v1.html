<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Belt Hacker</title>
  <meta name="description" content="Defender first cybersecurity from an OSCP and BJJ black belt.">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #f7f6f2;
      --ink: #1c1d21;
      --muted: #5d606b;
      --line: #dedcd4;
      --accent: #b3261e;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121317;
        --ink: #ecebe6;
        --muted: #a2a5ae;
        --line: #2b2d34;
        --accent: #ff6b5e;
        --card: #1a1b20;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 20px 40px;
      flex: 1;
    }
    .belt {
      width: 56px;
      height: 8px;
      background: var(--ink);
      border-radius: 2px;
      position: relative;
      margin-bottom: 28px;
    }
    .belt::after {
      content: "";
      position: absolute;
      right: 8px;
      top: 0;
      width: 10px;
      height: 8px;
      background: var(--accent);
    }
    h1 {
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.1;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    .lede { color: var(--muted); font-size: 19px; margin: 0 0 40px; }
    h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 12px;
    }
    ul.links { list-style: none; padding: 0; margin: 0 0 40px; }
    ul.links li {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 10px;
    }
    ul.links a {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
    }
    ul.links a:hover, ul.links a:focus { color: var(--accent); }
    ul.links span { display: block; color: var(--muted); font-size: 15px; }
    p { margin: 0 0 16px; }
    footer {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 40px;
      color: var(--muted);
      font-size: 14px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <div class="belt" aria-hidden="true"></div>
    <h1>Black Belt Hacker</h1>
    <p class="lede">Defender first cybersecurity. Agent security kits, penetration testing, and field notes.</p>

    <h2>About</h2>
    <p>Defender first security writing. The kits are sold on Gumroad. There are no ads and no tracking.</p>

    <h2>Contact</h2>
    <p>Email <a href="mailto:n0auth@blackbelthacker.com">n0auth@blackbelthacker.com</a>.</p>
  </main>
  <footer>© 2026 blackbelthacker.com</footer>
</body>
</html>
