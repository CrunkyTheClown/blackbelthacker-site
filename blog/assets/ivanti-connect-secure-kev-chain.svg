<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Ivanti Connect Secure response order: preserve evidence, shrink exposure, patch, hunt, rotate, rebuild.">
  <rect width="760" height="260" fill="#ffffff"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5a5a5a"/></marker></defs>
  <text x="380.0" y="34" text-anchor="middle" fill="#1a1a1a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="600">Patching is not step one</text>
  <rect x="15" y="85" width="108" height="80" rx="8" fill="#0b3d2e"/>
  <text x="69.0" y="121.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">1. Preserve</text>
  <text x="69.0" y="139.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">logs, exports</text>
  <rect x="139" y="85" width="108" height="80" rx="8" fill="#245c46"/>
  <text x="193.0" y="121.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">2. Shrink</text>
  <text x="193.0" y="139.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">exposure</text>
  <line x1="124" y1="125" x2="137" y2="125" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="263" y="85" width="108" height="80" rx="8" fill="#2f6b53"/>
  <text x="317.0" y="121.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">3. Patch</text>
  <text x="317.0" y="139.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">29 Oct builds</text>
  <line x1="248" y1="125" x2="261" y2="125" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="387" y="85" width="108" height="80" rx="8" fill="#8a2e0b"/>
  <text x="441.0" y="121.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">4. Hunt</text>
  <text x="441.0" y="139.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">from 1 Oct</text>
  <line x1="372" y1="125" x2="385" y2="125" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="511" y="85" width="108" height="80" rx="8" fill="#5a1f0c"/>
  <text x="565.0" y="121.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">5. Rotate</text>
  <text x="565.0" y="139.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">AD secrets</text>
  <line x1="496" y1="125" x2="509" y2="125" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="635" y="85" width="108" height="80" rx="8" fill="#5a1f0c"/>
  <text x="689.0" y="121.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">6. Rebuild</text>
  <text x="689.0" y="139.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">if in doubt</text>
  <line x1="620" y1="125" x2="633" y2="125" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="380.0" y="205" text-anchor="middle" fill="#5a5a5a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">CVE-2026-104935 + CVE-2026-111357 + CVE-2026-118527</text>
  <text x="380.0" y="228" text-anchor="middle" fill="#5a5a5a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">Closing a patch ticket is not proving the edge was clean.</text>
</svg>
