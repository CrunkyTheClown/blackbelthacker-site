<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 255" role="img" aria-label="PHP2Shell minimum safe builds per branch: 8.5.12, 8.4.27, 8.3.36, 8.2.35; PHP 8.1 and older get no upstream fix.">
  <rect width="720" height="255" fill="#ffffff"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5a5a5a"/></marker></defs>
  <text x="360.0" y="34" text-anchor="middle" fill="#1a1a1a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="600">PHP2Shell (CVE-2026-109618, CVE-2026-109619): minimum safe builds</text>
  <rect x="25" y="75" width="125" height="90" rx="8" fill="#0b3d2e"/>
  <text x="87.5" y="107.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600">PHP 8.5</text>
  <text x="87.5" y="125.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">fixed in</text>
  <text x="87.5" y="143.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">8.5.12</text>
  <rect x="165" y="75" width="125" height="90" rx="8" fill="#0b3d2e"/>
  <text x="227.5" y="107.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600">PHP 8.4</text>
  <text x="227.5" y="125.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">fixed in</text>
  <text x="227.5" y="143.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">8.4.27</text>
  <rect x="305" y="75" width="125" height="90" rx="8" fill="#0b3d2e"/>
  <text x="367.5" y="107.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600">PHP 8.3</text>
  <text x="367.5" y="125.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">fixed in</text>
  <text x="367.5" y="143.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">8.3.36</text>
  <rect x="445" y="75" width="125" height="90" rx="8" fill="#0b3d2e"/>
  <text x="507.5" y="107.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="14" font-weight="600">PHP 8.2</text>
  <text x="507.5" y="125.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">fixed in</text>
  <text x="507.5" y="143.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">8.2.35</text>
  <rect x="585" y="75" width="115" height="90" rx="8" fill="#8a2e0b"/>
  <text x="642.5" y="107.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">8.1 and older</text>
  <text x="642.5" y="125.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">no upstream fix</text>
  <text x="642.5" y="143.0" text-anchor="middle" fill="#f7f4ef" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">upgrade or isolate</text>
  <text x="360.0" y="205" text-anchor="middle" fill="#5a5a5a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">Released 21 Oct. KEV 26 Oct, federal due date 29 Oct 2026. PHP says there are no complete mitigations.</text>
  <text x="360.0" y="229" text-anchor="middle" fill="#5a5a5a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12">Then rank what you find by exposure: internet first, partner next, internal last.</text>
